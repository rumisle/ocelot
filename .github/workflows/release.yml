name: release
# Builds and publishes a release whenever the version (upstream.txt + revision.txt) is new.
on:
  push:
    branches: [main]
    paths: [upstream.txt, revision.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: version
        run: |
          v=$(sed 's/^v//' upstream.txt | tr -d '[:space:]')-$(tr -d '[:space:]' < revision.txt)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; fi
      - if: ${{ !steps.version.outputs.exists }}
        run: |
          git config --global user.name ocelot-ci && git config --global user.email ocelot-ci@users.noreply.github.com
          scripts/apply.sh
          scripts/build.sh linux-x64 darwin-arm64
      - if: ${{ !steps.version.outputs.exists }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prev=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)
          {
            echo "Built on OpenCode $(tr -d '[:space:]' < upstream.txt)."
            echo
            echo "### Patches"
            sed -e 's/#.*//' patches/series | awk 'NF { print "- `" $0 "`" }'
            if [ -n "$prev" ]; then
              echo
              echo "### Changes since $prev"
              git log --format='- %s' "$prev..HEAD"
            fi
          } > notes.md
          gh release create "v$VERSION" dist/*.tar.gz --title "ocelot $VERSION" --notes-file notes.md
